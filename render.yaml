services:
  - type: worker
    name: chat-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_MODE
        value: polling
      - key: BOT_TOKEN
        sync: false
      - key: AIMLAPI_KEY
        sync: false
      - key: AIMLAPI_URL
        value: https://api.aimlapi.com/v1/chat/completions
      - key: AI_MODEL
        value: openai/gpt-4.1-2025-04-14
